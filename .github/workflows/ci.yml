name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockflow
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway CI values; nothing here is used outside this job.
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks (production settings)
        env:
          DJANGO_PRODUCTION: "True"
          SECRET_KEY: ci-only-production-check-key-0123456789-abcdefghijklmnop
          ALLOWED_HOSTS: stockflow.demo.karbaschian.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn > /dev/null

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Tests (PostgreSQL)
        run: pytest -v --cov=inventory --cov=config --cov-report=term-missing

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker network create --internal demo-apps
          cp .env.demo.example .env.demo
          docker compose -f compose.demo.yml config --quiet
      - name: Build the production image
        run: docker build --tag stockflow-demo:ci .
